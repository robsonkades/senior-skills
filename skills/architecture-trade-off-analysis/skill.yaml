schemaVersion: 1

name: architecture-trade-off-analysis
version: 1.0.0
description: >-
  Compare architectural alternatives when quality goals conflict, a scorecard or
  case study is being used as a verdict, options mix abstraction levels,
  advocates disagree, or a benchmark needs a decision rule. Build comparable
  options, separate constraints from preferences, test domain scenarios and
  uncertainty, and recommend a choice or a bounded next step. Excludes ADR
  lifecycle (architecture-decision-making), quality-driver elicitation, domain
  pattern selection and debt repayment.
license: Apache-2.0

