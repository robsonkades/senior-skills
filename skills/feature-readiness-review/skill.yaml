schemaVersion: 1

name: feature-readiness-review
version: 1.1.0
description: >-
  Review feature intake, implementation readiness and completion against the accepted baseline.
  Use before dependent implementation, when completion lacks evidence, or when a Senior HCM
  integration specification, transition/support plan or acceptance-test result needs review.
  Identify unresolved business
  rules, technical prerequisites, ownership and evidence, with a return path for each blocker.
  Does not review code defects (code-review), choose automated checks (quality-gates), author
  missing requirements, or turn a ready specification into proof of a working integration.
license: Apache-2.0

authors:
  - name: senior-skills contributors
    url: https://github.com/robsonkades/senior-skills

homepage: https://github.com/robsonkades/senior-skills/tree/main/skills/feature-readiness-review
repository:
  type: git
  url: https://github.com/robsonkades/senior-skills
  directory: skills/feature-readiness-review

keywords:
  - feature
  - readiness
  - review
  - completion
  - gates
  - checklist
  - hcm
  - homologation

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: code-review
    version: ^1.0.0
  - name: coding-agent-discipline
    version: ^1.0.0
  - name: quality-gates
    version: ^1.0.0

suggests:
  - collaborative-feature-definition
  - feature-contract-definition
  - feature-engineering
  - feature-implementation-plan
  - feature-progress-tracking
  - feature-scope-analysis

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Feature Readiness Review
      short_description: The gate before, and the review after
      default_prompt: Use Feature Readiness Review to gate this feature before
        implementing or before completing.
