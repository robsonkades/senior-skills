schemaVersion: 1

name: debugging
version: 1.0.0
description: >-
  Finding the cause of a fault instead of a change that makes the symptom go
  away: reproducing before diagnosing, shrinking the reproduction until nothing
  is removable, stating a hypothesis that predicts an observation, changing one
  variable at a time, bisecting, and choosing which evidence to collect from a
  running production system before it is destroyed. Use when a fix is being
  guessed at, when a change "seems to work", when the same bug keeps coming
  back, when a fault cannot be reproduced, when a production incident needs a
  cause rather than a restart, when print statements are being added everywhere,
  or when several changes were made at once and it now works. Does not cover JVM
  performance triage, GC, live thread diagnosis, heap dump mechanics, or
  deliberately injecting failures.

