  - name: coding-agent-discipline
    description: "The reporting and restraint rules for an AI agent changing someone's codebase: never claiming a result
      that was not observed, saying which commands ran and what they printed, reporting what could not be verified
      rather than omitting it, keeping the diff to what was asked, preserving behaviour that was not in scope, checking
      APIs against the versions the project actually depends on, and refusing to make a test pass by weakening it. Use
      before reporting that work is complete, when about to write \"this should work\" or \"tests pass\", when a change
      is growing beyond the request, when a test is failing and deleting or disabling it is tempting, when an API is
      being used from memory rather than checked, or when two instructions cannot both be satisfied. Does not cover the
      order of work (clean-delivery-workflow), which checks to run (quality-gates), or how to phrase a message to a
      human."
    keywords:
      - agent
      - verification
      - scope
      - reporting
      - honesty
      - restraint
