schemaVersion: 1

name: layering-and-boundaries
version: 1.0.0
description: >-
  Deciding where an enterprise application's boundaries go and which direction
  dependencies cross them: the classical presentation / domain / data-source
  split, the styles that reorganise it (hexagonal, clean, modular monolith,
  vertical slices), and how a boundary is enforced rather than documented. Use
  when a package structure is argued about, when a controller contains business
  rules, when an entity or DTO travels end to end, when a service layer only
  forwards, when hexagonal is adopted without a driver, or when adding a field
  requires editing seven files. Does not cover which layer business rules take,
  whether a boundary should be remote, the data-access patterns, or what the
  application service around a use case owns.

