  - name: requirements-and-acceptance
    description: "Turning a request into something buildable and checkable before writing code: separating the requirement
      from the implementation someone already chose, finding the ambiguities that change the work, naming assumptions
      where they can be contradicted, writing acceptance criteria that a test can be derived from, and surfacing
      contradictions instead of resolving them silently. Use before implementing a ticket whose edge cases are unstated,
      when a request names a solution rather than a need, when \"fast\", \"secure\" or \"reliable\" appears without a
      number, when two requirements cannot both hold, when business rules overlap or change by effective date, when a
      change is rejected in review for doing the wrong thing, or when deciding whether to ask or to proceed on a stated
      assumption. Does not cover how long it will take, how to deliver the message, the test level, or the order of work
      (clean-delivery-workflow)."
    keywords:
      - requirements
      - acceptance-criteria
      - ambiguity
      - assumptions
      - definition-of-done
      - scope
      - business-rules
      - decision-tables
