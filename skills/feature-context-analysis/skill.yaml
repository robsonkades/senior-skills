schemaVersion: 1

name: feature-context-analysis
version: 1.1.0
description: >-
  Establish evidence for one feature from its repository or product and integration context.
  Use before proposing reuse or technology, when existing capabilities are asserted without
  evidence, or when Senior HCM or Connect needs module, version, configuration, interface or
  sample-data readiness verification without source-code access. Report supported findings, reuse candidates,
  source conflicts and bounded unknowns. Does not select a solution or authorize technology
  (feature-decision-analysis), own the impact map (feature-architecture-analysis), or audit
  an entire codebase for defects.
license: Apache-2.0

authors:
  - name: senior-skills contributors
    url: https://github.com/robsonkades/senior-skills

homepage: https://github.com/robsonkades/senior-skills/tree/main/skills/feature-context-analysis
repository:
  type: git
  url: https://github.com/robsonkades/senior-skills
  directory: skills/feature-context-analysis

keywords:
  - feature
  - codebase
  - investigation
  - patterns
  - reuse
  - context
  - hcm
  - integration

files:
  - SKILL.md
  - skill.yaml
  - references/

suggests:
  - feature-architecture-analysis
  - feature-contract-definition
  - feature-decision-analysis
  - feature-engineering
  - feature-requirement-clarification
  - layering-and-boundaries

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Feature Context Analysis
      short_description: Verify repository and product integration context
      default_prompt: Use Feature Context Analysis to establish the relevant repository
        or product integration context and its evidence limits.
