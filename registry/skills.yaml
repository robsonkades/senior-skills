  - name: architecture-coupling-and-quanta
    description: Map release and runtime coupling when services ship together, event-driven components still require
      coordinated changes, shared data obscures ownership, or a proposed architecture quantum boundary cannot be
      justified. Distinguish structural dependencies, workflow completion and connascence using contracts, deployment
      evidence and failure behavior. Does not choose service extractions, diagnose architecture smells, or refactor
      package dependencies.
