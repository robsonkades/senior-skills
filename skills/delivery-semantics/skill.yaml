schemaVersion: 1

name: delivery-semantics
version: 1.0.0
description: >-
  Precise end-to-end delivery and processing semantics: acknowledgement
  placement, loss and duplicate windows, Kafka transactions, visibility leases,
  ambiguous outcomes and external side effects. Use when reviewing "exactly
  once", consumer commits, publisher confirms, redelivery or a handler that
  writes outside its broker. Idempotent handler design, retries, ordering and
  poison-message handling require separate implementation decisions.

license: Apache-2.0

authors:
  - name: senior-skills contributors
    url: https://github.com/robsonkades/senior-skills

homepage: https://github.com/robsonkades/senior-skills/tree/main/skills/delivery-semantics
repository:
  type: git
  url: https://github.com/robsonkades/senior-skills
  directory: skills/delivery-semantics

keywords:
  - distributed-systems
  - messaging
  - kafka
  - at-least-once
  - exactly-once
  - acknowledgement
  - duplicates

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: failure-models
    version: ^1.0.0

suggests: []

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Delivery Semantics
      short_description: At-most-once, at-least-once, effectively-once
      default_prompt: Use Delivery Semantics to state the delivery guarantee this path
        actually provides.
