  - name: architecture-decision-making
    description: Write, review, reconstruct or supersede architecture decision records when rationale is missing, a decision
      is repeatedly reopened, a proposal needs an explicit outcome, or an accepted choice changes. Decide how much
      record is warranted; preserve evidence, alternatives, consequences, decision authority and revisit conditions.
      Covers ADR scope, lifecycle and traceability; option comparison belongs to architecture-trade-off-analysis,
      quality drivers must be observable inputs, and shortcut/repayment choices belong to technical-debt-decisions.
    keywords:
