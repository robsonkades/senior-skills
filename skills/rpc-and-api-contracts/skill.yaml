schemaVersion: 1

name: rpc-and-api-contracts
version: 1.0.0
description: >-
  The contract between two services and how it changes without a coordinated
  deploy: partial failure as a first-class outcome, an error surface a machine
  caller can act on (stable extensible codes, outcome certainty, retry
  conditions, RFC 9457), compatibility in both directions and
  expand-then-contract, versioning under an explicit compatibility policy, and
  choosing REST, gRPC or messaging on observable conditions. Use when a client
  branches on an error message string, when a field is renamed or a proto field
  number reused, when a rolling deploy breaks consumers, when a synchronous
  endpoint fronts a long-running operation, when a new version is proposed for
  an additive change, or when a consumer fails on an unknown JSON property. Does
  not cover delivery guarantees (delivery-semantics), the deadline itself,
  wire-format cost, the exception hierarchy, or event contracts.

