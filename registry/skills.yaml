  - name: technical-debt-decisions
    description: "Deciding when a shortcut is a legitimate trade and when it is just damage: separating deliberate and
      inadvertent debt, constraints delivery pressure does not waive, containing a shortcut so it can be undone,
      recording it where someone will find it, and choosing which debt to repay by its carrying cost rather than by how
      much it annoys you. Use when a deadline or an incident is pushing work to be cut, when someone proposes shipping
      now and cleaning up later, when a spike is about to become production code, when \"technical debt\" is being used
      to justify a rewrite, when a debt backlog has grown into a list nobody reads, or when deciding whether to fix
      something you have just noticed. Does not cover the refactoring mechanics of repaying it, how to detect the
      problem, how to communicate the trade, or which gates may be skipped (quality-gates)."
    keywords:
      - technical-debt
      - trade-offs
      - deadlines
      - incidents
